# Project-wide Gradle settings — You-Tube (performance-first build config)

# JVM: parallel GC keeps configuration/build phases fast without huge memory ceilings
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
# Smaller R classes -> faster compilation, smaller APK surface
android.nonTransitiveRClass=true
# R8 full mode: aggressive tree-shaking, merging & optimization (default in AGP 8.x, kept explicit)
android.enableR8.fullMode=true

kotlin.code.style=official
