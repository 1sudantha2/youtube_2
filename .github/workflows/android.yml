name: Build You-Tube APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-licensed Android SDK at ANDROID_HOME.
      # This idempotent step just guarantees the exact components AGP 8.7 wants.
      - name: Ensure Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "SDK components:" && ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Optional: override the committed sideload keystore with your own via secrets
      - name: Decode signing keystore from secrets (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/you-tube-release.p12"
            echo "YT_KEYSTORE_PATH=$RUNNER_TEMP/you-tube-release.p12" >> "$GITHUB_ENV"
            echo "YT_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "YT_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "YT_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets set — using the committed release keystore."
          fi

      - name: Build release APK (R8 full mode)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compiles errors surfaced as annotations so they are visible
      # without downloading the full log (and as a build-failure artifact).
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          grep -aE "^e: |error: |Caused by: |FAILURE: " "$RUNNER_TEMP/build.log" | head -100 \
            | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-900)"; done
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

      - name: Collect APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "You-Tube-v${VERSION}.apk"
          ls -lh *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: You-Tube-APK
          path: "*.apk"
          compression-level: 0

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.apk"
