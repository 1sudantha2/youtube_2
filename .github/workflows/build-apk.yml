name: Build & Release APK

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Set to "release" to produce an R8-minified, shrink-resources APK instead of a debug one.
  DEFAULT_BUILD_TYPE: debug

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests (pure JVM: InnerTube parsing, SAPISIDHASH, manifest builder)
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Assemble APKs (one per ABI + universal)
  # ---------------------------------------------------------------------------
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve build type
        id: vars
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || env.DEFAULT_BUILD_TYPE }}"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Building: $BUILD_TYPE"

      - name: Decode release keystore (optional)
        if: steps.vars.outputs.build_type == 'release' && env.RELEASE_KEYSTORE_B64 != ''
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Assemble APK
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assemble${{ steps.vars.outputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Collect & rename artifacts
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ steps.vars.outputs.build_type }}"
          VERSION="$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)"
          mkdir -p apk
          find app/build/outputs/apk -name "*.apk" -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            # app-arm64-v8a-debug.apk -> You-Tube-1.0.0-arm64-v8a-debug.apk
            abi="$(echo "$base" | sed -E 's/^app-([^-]+(-[^-]+)?)-.*/\1/')"
            case "$abi" in
              arm64-v8a|armeabi-v7a|x86_64|universal) ;;
              *) abi="universal" ;;
            esac
            cp "$f" "apk/You-Tube-${VERSION}-${abi}-${BUILD_TYPE}.apk"
          done
          ls -lh apk

      - name: Upload APK artifact (branches)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: You-Tube-${{ steps.vars.outputs.build_type }}-apks
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Lint report (non-blocking)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
