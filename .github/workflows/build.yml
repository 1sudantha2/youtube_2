name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Build release APK (R8 full mode)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error: |FAILURE: Build failed|Caused by: " build_output.log \
            | sort -u | head -45 | cut -c1-380 \
            | while IFS= read -r line; do echo "::error::${line//%/}"; done
          echo "total-errors=$(grep -cE '^e: ' build_output.log || true)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: You-Tube-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: You-Tube-apk
          path: apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
